# с использование npm run build и проксированием в php контейнер без запуска npm

services:
  php:
    build:
      context: .
      dockerfile: ./deploy/builded/php/Dockerfile
      target: php-fpm
    container_name: exo-php
    restart: on-failure
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-laravel}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-password}
    volumes:
      - ./:/var/www/html
      - backend_vendor:/var/www/vendor
    depends_on:
      - db
    networks:
      - app-network

  nginx:
    build:
      context: .
      dockerfile: ./deploy/builded/nginx/Dockerfile
    container_name: exo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./deploy/builded/nginx/conf.d/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: exo-db
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-laravel}
    ports:
      - "3306:3306"
    networks:
      - app-network

volumes:
  db-data:
  backend_vendor:

networks:
  app-network:
    driver: bridge
