# с использование npm run dev и связью фронта и бэка как отдельными контейнерами
#
services:
  php:
    build:
      context: .
      dockerfile: ./deploy/dev/php/Dockerfile
    container_name: exo-php
    restart: on-failure
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-laravel}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-password}
    volumes:
      - ./:/var/www/html
      - backend_vendor:/var/www/vendor
    depends_on:
      - db
    networks:
      - app-network

  frontend:
    image: node:22-alpine
    container_name: exo-frontend
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - app-network

  nginx:
    build:
      context: .
      dockerfile: ./deploy/dev/nginx/Dockerfile
    container_name: exo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./deploy/dev/nginx/conf.d/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: exo-db
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-laravel}
    ports:
      - "3306:3306"
    networks:
      - app-network
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
  backend_vendor:

networks:
  app-network:
    driver: bridge
