# с использование npm run build и проксированием в php контейнер без запуска npm

services:
    app:
        build:
            context: .
            dockerfile: ./deploy/build/php/Dockerfile

        container_name: exo-app
        restart: no
        volumes:
            - .:/var/www/html
            - backend_vendor:/var/www/html/vendor
        depends_on:
            db:
                condition: service_healthy
        networks:
            - app-network
        healthcheck:
            test: ['CMD', 'php', 'artisan', '--help']
            timeout: 20s
            retries: 40

    nginx:
        build:
            context: .
            dockerfile: ./deploy/build/nginx/Dockerfile
        container_name: exo-nginx
        restart: unless-stopped
        ports:
            - '80:80'
        volumes:
            - .:/var/www/html:ro
            - ./deploy/build/nginx/conf.d/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            app:
                condition: service_healthy
        networks:
            - app-network

    db:
        image: mysql:8.0
        container_name: exo-db
        restart: on-failure
        environment:
            MYSQL_ROOT_PASSWORD: root_password
            MYSQL_DATABASE: ${DB_DATABASE:-laravel}
            MYSQL_USER: laravel
            MYSQL_PASSWORD: ${DB_PASSWORD:-laravel}
        ports:
            - '127.0.0.1:3306:3306'
        networks:
            - app-network
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
            timeout: 10s
            retries: 10

volumes:
    db-data:
    backend_vendor:

networks:
    app-network:
        driver: bridge
